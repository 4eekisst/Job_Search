databaseChangeLog:
  - changeSet:
      id: create users table
      author: Adil
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(45)
              - column:
                  name: surname
                  type: varchar(45)
              - column:
                   name: age
                   type: int
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: password
                  type: varchar(255)
              - column:
                  name: phoneNumber
                  type: varchar(45)
              - column:
                  name: avatar
                  type: varchar(255)
              - column:
                  name: enabled
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: authority_id
                  type: long
                  constraints:
                    nullable: false
                    foreignKeyName: fk_authority_users_id
                    references: authorities(id)
              - column:
                  name: reset_password_token
                  type: varchar(255)

  - changeSet:
      id: create category table
      author: Adil
      changes:
        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(45)
              - column:
                  name: parent_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_category_parent_id
                    references: category(id)
